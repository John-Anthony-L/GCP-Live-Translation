version: '3.8'

services:
  translation-pipeline:
    build:
      context: services/translation-pipeline
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - PROJECT_ID=${PROJECT_ID:-your-gcp-project-id}
      - LOCATION=${LOCATION:-us-central1}
      - CHIRP_REGION=${CHIRP_REGION:-us}
      - GEMINI_TRANSCRIBE_MODEL=${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe-live-preview}
      - GEMINI_TRANSCRIBE_LOCATION=${GEMINI_TRANSCRIBE_LOCATION:-global}
      - GEMINI_LIVE_TRANSLATE_MODEL=${GEMINI_LIVE_TRANSLATE_MODEL:-gemini-3.5-live-translate-preview}
      - GEMINI_LIVE_TRANSLATE_LOCATION=${GEMINI_LIVE_TRANSLATE_LOCATION:-global}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      - GEMINI_LIVE_LOCATION=${GEMINI_LIVE_LOCATION:-us-central1}
      - GLOSSARY_ID=${GLOSSARY_ID:-brand-parks-glossary-en-es}
      - GLOSSARY_BUCKET=${GLOSSARY_BUCKET:-your-gcp-project-id-glossaries}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/app/service-account.json:ro
      - ./glossaries:/app/glossaries:ro

  web-client:
    build:
      context: services/web-client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TRANSLATION_PIPELINE_URL=http://localhost:8081
    depends_on:
      - translation-pipeline
