version: '3.8'

services:
  gemini-live-proxy:
    build:
      context: .
      dockerfile: services/gemini-live-proxy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PROJECT_ID=disney-parks-live-translation
      - LOCATION=us-central1
      - GEMINI_LIVE_MODEL=gemini-2.0-flash-exp
      - DEFAULT_VOICE=Aoede
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/app/service-account.json:ro
      - ./glossaries:/app/glossaries:ro

  translation-pipeline:
    build:
      context: .
      dockerfile: services/translation-pipeline/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - PROJECT_ID=disney-parks-live-translation
      - LOCATION=us-central1
      - CHIRP_REGION=us
      - STT_MODEL=chirp_3
      - GLOSSARY_ID=disney-parks-glossary-en-es
      - GLOSSARY_BUCKET=disney-parks-live-translation-glossaries
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/app/service-account.json:ro
      - ./glossaries:/app/glossaries:ro

  web-client:
    build:
      context: services/web-client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_LIVE_PROXY_URL=ws://localhost:8080/live-translate
      - TRANSLATION_PIPELINE_URL=http://localhost:8081
    depends_on:
      - gemini-live-proxy
      - translation-pipeline
